title: Compact conditional computation
question: Can DAWN-SRW preserve language-model quality while organizing state-conditioned computation through a condition coordinate substantially lower-dimensional than the model hidden state?
rationale: A compact coordinate is central to the proposed control and hardware-address interpretation, but the current registered reference uses one fixed route width and does not establish how quality, effective dimensionality or operator behavior change as that width is reduced.
scope: Matched DAWN-SRW configurations at pinned implementation revisions, with route dimension, effective dimension, training budget, data and evaluation protocol stated explicitly; no claim about all neural networks.
status: open
