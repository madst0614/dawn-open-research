title: Formal ownership and safe-pruning analysis
description: Checked derivation of the geometric guarantees and counterexamples required by a computational-address index.
protocol: State the coordinate domain, distance, tie rule, ownership target and retrieval target; prove or refute completeness and exclusivity of nearest-anchor ownership; derive center-radius lower bounds only under an explicit metric and conservative radius; derive the conditions under which radius plus a verified drift bound remains conservative; construct boundary counterexamples separating owner-cell lookup from global nearest-operator retrieval; and state precisely what greedy hierarchy, multi-probe and branch-and-bound do and do not guarantee.
