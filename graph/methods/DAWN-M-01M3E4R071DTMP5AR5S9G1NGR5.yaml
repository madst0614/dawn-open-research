title: Autoregressive generation validation
description: Deterministic fixed-prompt qualification of a pinned checkpoint's autoregressive language behavior.
protocol: >-
  Restore the exact committed checkpoint and verify its digest, model configuration,
  checkpoint structure and tokenizer identity, including tokenizer implementation,
  vocabulary, special-token settings and available digests. If checkpoint metadata
  and a reproducible validation slice permit it, compare validation cross-entropy or
  an equivalent likelihood measure with the recorded reference under a declared
  tolerance; otherwise record why that consistency check is unavailable. Before
  execution, freeze prompt text and order in a versioned manifest spanning plain prose,
  factual or expository prose, dialogue, narrative, short context, longer context and
  punctuation or sentence-boundary continuation. Run deterministic greedy decoding first,
  with sampling disabled, fixed special-token handling and max_new_tokens=128, preserving each exact prompt and
  tokenized input. Require finite logits and scores, inspect whether each continuation
  is conditioned on its prompt, and flag immediate pathological repetitive collapse,
  including a 1-to-8-token cycle occupying at least 24 consecutive generated tokens or
  one non-special token exceeding 80 percent of the first 32 generated tokens. Repeat
  every prompt twice under the same pinned runtime and require identical generated token
  IDs. Preserve generated_samples.jsonl, the prompt-suite manifest, checkpoint/tokenizer/
  configuration integrity metadata, validation-consistency evidence when available,
  decoding parameters, token IDs, numerical and repetition checks, and a run manifest.
  A named reviewer must inspect the samples and protocol evidence before any Result is
  authored; generation output alone is not a Result.
status: proposed
