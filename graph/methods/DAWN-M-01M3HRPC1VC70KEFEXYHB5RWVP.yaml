title: Semantic-locality and causal-intervention analysis
description: Function-first analysis of whether coordinate proximity predicts and causally organizes computation.
protocol: From a pinned checkpoint, extract declared condition or operator coordinates and matched activation contexts; preregister functional measures independently of the geometry, such as transition similarity, substitution cost, co-activation or causal effect-vector similarity; sample pairs across distance quantiles with coordinate-permutation and frequency or activation-matched nulls; freeze any discovered operator families before testing their address compactness; then compare suppression, exact restoration, nearby substitution, far substitution and random or magnitude-matched controls on identical inputs; report geometry-function calibration, null comparisons, intervention effects, task-quality changes and negative or collapsed cases separately.
status: proposed
