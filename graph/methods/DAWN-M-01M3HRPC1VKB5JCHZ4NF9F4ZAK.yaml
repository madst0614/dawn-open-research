title: Dynamic computational-index simulation
description: Replay study of address-index correctness, selectivity and update cost as learned coordinates move during training.
protocol: Capture coordinate snapshots at preregistered training intervals; build an exact reference index at the initial snapshot; replay identical snapshots under exact rebuild, fixed stale, conservative drift-expanded and local or lazy refresh policies, with address smoothing evaluated only as a separate intervention; compare every policy against exhaustive search and exact rebuild; report coordinate drift, false-positive and false-negative pruning, retrieval recall, refresh volume, cell reassignment and simulated operator migration, while keeping physical migration separate from metadata refresh.
status: proposed
