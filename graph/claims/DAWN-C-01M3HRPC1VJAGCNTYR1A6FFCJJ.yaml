title: Computational address space
statement: A computational address space is a compact coordinate domain whose declared lookup semantics maps model states to functionally relevant computation and may resolve logical cells to hardware without identifying semantic geometry with physical placement.
claim_type: definition
scope: Candidate conditional-computation systems with explicit coordinates, lookup semantics and a separately specified logical-to-physical mapping.
status: proposed
