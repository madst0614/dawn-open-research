title: Semantic locality
statement: Semantic locality is the empirical property that proximity in a declared computational coordinate system predicts a preregistered functional relation under independent controls; visual clustering or proximity by construction alone does not satisfy the definition.
claim_type: definition
scope: Analyses of learned condition or operator coordinates where the metric, functional relation, sampling protocol and null model are stated explicitly.
status: proposed
