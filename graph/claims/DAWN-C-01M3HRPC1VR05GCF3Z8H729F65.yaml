title: Conservative stale-bound safety
statement: Under a genuine metric, expanding a previously valid region radius by a verified upper bound on coordinate drift preserves containment and therefore prevents false-negative lower-bound pruning until the next refresh.
claim_type: proposition
scope: Search regions whose original radius and subsequent per-member drift bound are both conservative under the same metric; efficiency and bound tightness are separate empirical questions.
status: proposed
