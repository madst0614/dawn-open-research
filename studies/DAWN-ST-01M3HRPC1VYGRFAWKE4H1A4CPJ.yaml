goal: Measure whether a computational-address index can remain correct and selective during training without per-step global rebuild or uncontrolled operator migration.
motivation: Static addressability does not establish a trainable system. Coordinate drift, stale bounds, refresh traffic and cell reassignment must be measured on the same grounded training trajectory before physical placement is credible.
completion_criteria: Register time-indexed coordinate snapshots from a pinned training Run; fix the metric and conservative drift statistic; compare exact rebuild, stale, drift-expanded and local or lazy refresh on the same snapshots; verify false-negative behavior against exhaustive search; report selectivity, recall, update volume, cell churn and simulated migration while separating metadata refresh from physical movement.
known_limitations:
- No training-time coordinate trajectory is currently grounded in this repository.
- A safe radius expansion requires a genuine metric and a verified upper drift bound.
- Physical migration and network scheduling remain simulated and cannot establish hardware efficiency.
blockers:
- No time-indexed coordinate Artifact or producing Run is registered.
- A dynamic-index replay adapter is not registered.
- The metric, drift bound, refresh policy and acceptable churn thresholds are not fixed.
- No current TPU/TRC allocation is registered or verified for the required training trajectory.
- The TPU environment has no exact lock digest.
