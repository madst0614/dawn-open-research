goal: Determine whether grounded DAWN-SRW coordinates can support exclusive logical ownership and useful flat or hierarchical lookup before attempting physical multi-device execution.
motivation: Existing candidate-identification, logical-locality and physical-sparsity frontiers meet at the lookup layer, but a partition's existence does not establish semantic validity, retrieval correctness, low fan-out or hardware benefit.
completion_criteria: Fix the model coordinate, metric and retrieval semantics; obtain a grounded coordinate snapshot; discharge ownership, tie and safe-pruning proof obligations or record counterexamples; compare flat, greedy, multi-probe and branch-and-bound lookup; report owner-hardware recall, global top-k recall, boundary behavior, metadata, comparisons and probe counts; keep task quality, index quality and any systems estimate separate.
known_limitations:
- Unit-sphere normalization and angular distance are candidates rather than established requirements.
- Synthetic coordinates may test index mechanics but cannot establish learned neural locality.
- This simulation cannot establish physical speedup, communication savings or load balance.
- Query-traffic equalization, replication, fault tolerance and topology-aware scheduling are outside the initial scope.
blockers:
- No grounded condition or operator coordinate Artifact is registered.
- Cell-defined routing versus global nearest-operator retrieval is not selected.
- Target recall, hardware fan-out and quality-equivalence thresholds are not fixed.
- A computational-index simulator and operator-coordinate extraction adapter are not registered.
- No current TPU/TRC allocation or validated local simulation profile is registered.
