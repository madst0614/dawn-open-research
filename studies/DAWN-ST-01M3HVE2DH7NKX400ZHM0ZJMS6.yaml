goal: Determine whether an explicit shared low-dimensional coordinate for state and operator role can route DAWN-SRW computation while preserving preregistered language-model quality relative to a matched reference.
motivation: >-
  State-conditioned selection already exists in DAWN-SRW, but a shared conditional
  coordinate is a distinct architecture candidate whose computational value must be
  established by implementation audit and matched retraining. This Track A study proceeds
  independently of Track B semantic-geometry and hardware-locality research.
completion_criteria: >-
  Audit and pin the reference implementation; freeze the candidate specification,
  comparison controls, quality-equivalence margins and reproducible environment; complete
  small-scale sanity checks and preregistered matched runs; preserve all execution evidence;
  report validation, zero-shot, generation, stability, routing and coordinate diagnostics;
  and author any Result only after review.
known_limitations:
- Projection sharing, operator-role representation, compatibility function and conditional dimension are intentionally unresolved pending implementation audit.
- A matched comparison may retain unavoidable parameter-count or FLOP differences that must be reported explicitly.
- Geometric organization would not by itself establish semantic locality, interpretability or physical execution benefit.
blockers:
- The pinned reference routing and read implementation has not been audited into a reviewable architecture specification.
- The shared conditional-space implementation does not exist.
- A compatible training entrypoint and provider capability are not registered in DOR.
- The data revision, comparison margins and reproducible training environment are not frozen.
- No current TPU/TRC allocation is registered or verified.
