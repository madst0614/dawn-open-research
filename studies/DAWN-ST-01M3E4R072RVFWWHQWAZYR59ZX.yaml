goal: Determine how compact the condition coordinate and visible operator candidate set can be while preserving preregistered language-model quality and operator behavior.
motivation: Route dimension, candidate visibility and final functional activity are distinct constraints on conditional computation. Matched experiments are required before compact geometry or sparse activity can be interpreted as evidence that broad access is unnecessary.
completion_criteria: Complete matched route-dimension, post-hoc visibility and restricted-visibility training comparisons at pinned revisions; preregister quality-equivalence margins and candidate metrics; report task quality, training stability, effective dimension and operator behavior separately; preserve failures and distinguish reduced coordinate dimension from reduced candidate visibility.
known_limitations:
- No public research Result is established by this Study.
- The registered reference checkpoint is unavailable and has no digest.
- The current registered infrastructure does not expose matched route-dimension or visibility-training adapters.
blockers:
- No current TPU/TRC allocation is registered or verified.
- The exact training data revision, route-dimension sweep and quality-equivalence margin are not fixed.
- Visibility control and matched training/evaluation support are unverified.
