goal: Ground the implemented DAWN-SRW condition and operator coordinates, then test whether their geometry predicts functional relations and supports controlled causal intervention.
motivation: Stable or clustered coordinates are not sufficient evidence of meaningful organization. Function-first measurements, independent nulls and intervention are required to distinguish semantic locality from architecture- or objective-induced appearance.
completion_criteria: Audit the pinned implementation and expose exact coordinate and operator objects; preregister at least one functional metric independently of geometry; compare distance-stratified pairs against permutation and activation-matched nulls; complete suppression, restoration and near-versus-far substitution controls on grounded checkpoints; report task quality, geometry and causal effects separately and preserve negative outcomes.
known_limitations:
- No public research Result is established by this Study.
- The registered provider identifies v4172, while later operation-space implementations are not registered as executable infrastructure here.
- A visually coherent or auxiliary-loss-induced cluster does not satisfy the proposed semantic-locality definition.
blockers:
- The registered checkpoint is missing and has no digest.
- Coordinate extraction, functional-locality and intervention adapters are not registered.
- Functional-distance measures, sampling rules and success thresholds are not fixed.
- No current TPU/TRC allocation is registered or verified.
